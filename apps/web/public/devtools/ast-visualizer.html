<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code AST &amp; Syntax Token Visualizer</title>
    <style>
      :root {
        --bg: #090d16;
        --card-bg: #111827;
        --border: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --keyword: #f43f5e;
        --identifier: #38bdf8;
        --string: #34d399;
        --comment: #6b7280;
        --number: #fbbf24;
        --operator: #c084fc;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        height: 100vh;
        overflow: hidden;
      }

      .panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-header {
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.02);
      }

      .panel-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .panel-body {
        padding: 16px;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      textarea {
        width: 100%;
        height: 100%;
        flex: 1;
        background: #060a12;
        border: 1px solid var(--border);
        color: #e2e8f0;
        padding: 14px;
        border-radius: 6px;
        font-size: 12px;
        font-family: var(--mono);
        outline: none;
        resize: none;
        line-height: 1.6;
      }

      textarea:focus {
        border-color: var(--accent);
      }

      .btn {
        background: var(--accent);
        color: #090d16;
        font-weight: 600;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }

      .btn-secondary {
        background: #1f2937;
        color: var(--text);
      }

      .btn-secondary:hover {
        background: #374151;
      }

      /* Token Table */
      .token-table-wrap {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #060a12;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 11px;
      }

      th,
      td {
        padding: 6px 10px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      th {
        background: #0f172a;
        color: var(--muted);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .tag-keyword {
        color: var(--keyword);
        font-weight: 600;
      }
      .tag-identifier {
        color: var(--identifier);
      }
      .tag-string {
        color: var(--string);
      }
      .tag-comment {
        color: var(--comment);
        font-style: italic;
      }
      .tag-number {
        color: var(--number);
      }
      .tag-operator {
        color: var(--operator);
      }

      /* Metrics Bar */
      .metrics-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .metric-card {
        background: #0b1120;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        text-align: center;
      }

      .metric-val {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
      }

      .metric-lbl {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Left: Source Editor -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Source Code Input</div>
        <div style="display: flex; gap: 8px">
          <select
            id="sampleSelect"
            style="
              background: #0f172a;
              color: #fff;
              border: 1px solid var(--border);
              border-radius: 4px;
              padding: 2px 8px;
              font-size: 11px;
            "
          >
            <option value="ts">TypeScript / JS Sample</option>
            <option value="py">Python Sample</option>
            <option value="rust">Rust Sample</option>
          </select>
          <button class="btn" id="btnTokenize">⚡ Tokenize</button>
        </div>
      </div>

      <div class="panel-body">
        <textarea id="codeInput" spellcheck="false"></textarea>
      </div>
    </section>

    <!-- Right: Token Stream & AST Breakdown -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Parsed Token Stream &amp; Metrics</div>
        <button class="btn btn-secondary" id="btnExportJson">Export JSON</button>
      </div>

      <div class="panel-body">
        <div class="metrics-bar">
          <div class="metric-card">
            <div class="metric-val" id="metricLines">0</div>
            <div class="metric-lbl">Total Lines</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="metricTokens">0</div>
            <div class="metric-lbl">Tokens</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="metricComments">0</div>
            <div class="metric-lbl">Comments</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="metricBlank">0</div>
            <div class="metric-lbl">Blank Lines</div>
          </div>
        </div>

        <div class="token-table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 40px">#</th>
                <th style="width: 100px">Token Type</th>
                <th>Lexeme / Value</th>
                <th style="width: 60px">Line</th>
              </tr>
            </thead>
            <tbody id="tokenTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <script>
      const SAMPLES = {
        ts: `/**
 * Distributed Lock Coordinator for Multi-Agent Tasks.
 */
export async function acquireDistributedLock(resource: string, ttlMs = 5000): Promise<boolean> {
  const token = Math.random().toString(36).substring(2, 9);
  // Verify resource availability
  if (!resource || ttlMs <= 0) {
    throw new Error("Invalid resource lease duration");
  }
  return true;
}`,
        py: `class AgentRateLimiter:
    """Token bucket rate limiter for LLM invocations."""
    def __init__(self, capacity: int = 100, refill_rate: float = 10.0):
        self.capacity = capacity
        self.tokens = capacity
        self.refill_rate = refill_rate

    def acquire(self, cost: int = 1) -> bool:
        if self.tokens >= cost:
            self.tokens -= cost
            return True
        return False`,
        rust: `pub struct VirtualFileSystem {
    root: String,
    files_count: usize,
}

impl VirtualFileSystem {
    pub fn new(root: &str) -> Self {
        Self { root: root.to_string(), files_count: 0 }
    }
}`,
      };

      const KEYWORDS = new Set([
        "export",
        "async",
        "function",
        "const",
        "let",
        "var",
        "if",
        "else",
        "return",
        "throw",
        "new",
        "class",
        "def",
        "import",
        "from",
        "pub",
        "struct",
        "impl",
        "fn",
        "self",
        "Self",
        "true",
        "false",
        "null",
        "undefined",
        "Promise",
        "boolean",
        "string",
        "number",
      ]);

      const codeInput = document.getElementById("codeInput");
      const sampleSelect = document.getElementById("sampleSelect");
      const btnTokenize = document.getElementById("btnTokenize");
      const btnExportJson = document.getElementById("btnExportJson");
      const tokenTableBody = document.getElementById("tokenTableBody");

      const metricLines = document.getElementById("metricLines");
      const metricTokens = document.getElementById("metricTokens");
      const metricComments = document.getElementById("metricComments");
      const metricBlank = document.getElementById("metricBlank");

      let currentTokens = [];

      function runTokenizer() {
        const code = codeInput.value;
        const lines = code.split("\n");
        let blankCount = 0;
        let commentCount = 0;
        const tokens = [];

        lines.forEach((line, lineIdx) => {
          const lineNum = lineIdx + 1;
          const trimmed = line.trim();
          if (trimmed.length === 0) {
            blankCount++;
            return;
          }

          // Match comments
          if (
            trimmed.startsWith("//") ||
            trimmed.startsWith("#") ||
            trimmed.startsWith("/*") ||
            trimmed.startsWith("*")
          ) {
            commentCount++;
            tokens.push({ type: "comment", value: trimmed, line: lineNum });
            return;
          }

          // Regex token parser
          const regex =
            /("[^"]*"|'[^']*'|`[^`]*`|\b\d+(\.\d+)?\b|\b[a-zA-Z_$][a-zA-Z0-9_$]*\b|[+\-*\/=<>!&|]+|[{}()\[\];,.:])/g;
          let match;
          while ((match = regex.exec(line)) !== null) {
            const val = match[0];
            let type = "unknown";

            if (/^["'`]/.test(val)) {
              type = "string";
            } else if (/^\d+/.test(val)) {
              type = "number";
            } else if (KEYWORDS.has(val)) {
              type = "keyword";
            } else if (/^[a-zA-Z_$]/.test(val)) {
              type = "identifier";
            } else if (/^[+\-*\/=<>!&|]/.test(val)) {
              type = "operator";
            } else {
              type = "punctuation";
            }

            tokens.push({ type, value: val, line: lineNum });
          }
        });

        currentTokens = tokens;
        metricLines.textContent = lines.length;
        metricTokens.textContent = tokens.length;
        metricComments.textContent = commentCount;
        metricBlank.textContent = blankCount;

        tokenTableBody.innerHTML = "";
        tokens.forEach((tok, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
          <td style="color:#64748b;">${idx + 1}</td>
          <td><span class="tag-${tok.type}">${tok.type}</span></td>
          <td style="color:#f8fafc;">${escapeHtml(tok.value)}</td>
          <td style="color:#64748b;">${tok.line}</td>
        `;
          tokenTableBody.appendChild(tr);
        });
      }

      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      sampleSelect.addEventListener("change", () => {
        codeInput.value = SAMPLES[sampleSelect.value] || "";
        runTokenizer();
      });

      btnTokenize.addEventListener("click", runTokenizer);
      codeInput.addEventListener("input", runTokenizer);

      btnExportJson.addEventListener("click", () => {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(currentTokens, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "sleepers-ast-tokens.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      // Initial load
      codeInput.value = SAMPLES.ts;
      runTokenizer();
    </script>
  </body>
</html>
