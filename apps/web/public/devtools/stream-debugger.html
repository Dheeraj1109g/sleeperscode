<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket &amp; JSON-RPC Stream Protocol Debugger</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: #111827;
        --border: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: 20px;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 20px;
        height: 100vh;
        overflow: hidden;
      }

      .panel {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-header {
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.02);
      }

      .panel-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .panel-body {
        padding: 16px;
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input,
      select,
      textarea {
        width: 100%;
        background: #080d1a;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-family: var(--mono);
        outline: none;
      }

      input:focus,
      textarea:focus {
        border-color: var(--accent);
      }

      .btn {
        background: var(--accent);
        color: #0b0f19;
        font-weight: 600;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: opacity 0.15s ease;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn-danger {
        background: #ef4444;
        color: #ffffff;
      }

      .btn-secondary {
        background: #1f2937;
        color: var(--text);
      }

      .btn-secondary:hover {
        background: #374151;
      }

      /* Connection Card */
      .conn-card {
        background: #080d1a;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .conn-status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .badge-status {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .status-connected {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
      }
      .status-disconnected {
        background: rgba(239, 68, 68, 0.2);
        color: var(--danger);
      }
      .status-reconnecting {
        background: rgba(245, 158, 11, 0.2);
        color: var(--warning);
      }

      /* Stream Feed */
      .stream-feed {
        background: #080d1a;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        flex: 1;
        overflow-y: auto;
        font-family: var(--mono);
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .msg-row {
        display: flex;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.02);
        border-left: 3px solid var(--accent);
      }

      .msg-row.outbound {
        border-color: #a855f7;
      }
      .msg-row.inbound {
        border-color: #10b981;
      }
      .msg-row.heartbeat {
        border-color: #64748b;
        opacity: 0.6;
      }

      .msg-dir {
        font-weight: 700;
        width: 45px;
      }
      .msg-dir.out {
        color: #c084fc;
      }
      .msg-dir.in {
        color: #34d399;
      }
      .msg-dir.hb {
        color: #94a3b8;
      }

      .msg-channel {
        color: #38bdf8;
        font-weight: 600;
        width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .msg-body {
        flex: 1;
        color: #e2e8f0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .msg-time {
        color: var(--muted);
        font-size: 10px;
        width: 65px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <!-- Left: Connection & Publisher Control -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Transport &amp; Multiplexer Control</div>
        <span style="font-size: 11px; color: var(--muted)">WebSocketPool</span>
      </div>

      <div class="panel-body">
        <!-- Status Box -->
        <div class="conn-card">
          <div class="conn-status-row">
            <span style="font-size: 12px; font-weight: 600">Socket State:</span>
            <span class="badge-status status-connected" id="statusBadge">CONNECTED</span>
          </div>
          <div style="font-size: 11px; color: var(--muted)">
            Endpoint: <code style="color: var(--accent)">wss://sleepers-rpc.internal/v1</code>
          </div>
          <div style="font-size: 11px; color: var(--muted)">
            Queued Offline Messages: <strong id="queueCounter" style="color: #fbbf24">0</strong>
          </div>
        </div>

        <div style="display: flex; gap: 8px">
          <button class="btn" style="flex: 1" id="btnConnect">Connect</button>
          <button class="btn btn-danger" style="flex: 1" id="btnDisconnect">Simulate Drop</button>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border)" />

        <!-- Publish Message Form -->
        <div>
          <label for="channelSelect">Pub/Sub Channel</label>
          <select id="channelSelect">
            <option value="agent:tasks">agent:tasks (Task Execution Stream)</option>
            <option value="agent:telemetry">agent:telemetry (Metrics &amp; Token Rates)</option>
            <option value="workspace:fs">workspace:fs (File Modification Events)</option>
            <option value="rpc:invoke">rpc:invoke (JSON-RPC Remote Call)</option>
          </select>
        </div>

        <div>
          <label for="payloadInput">Message Payload (JSON)</label>
          <textarea id="payloadInput" style="height: 100px; resize: none">
{ "type": "task_dispatched", "taskId": "task-9021", "model": "gemini-flash" }</textarea
          >
        </div>

        <button class="btn" id="btnPublish" style="margin-top: auto">
          <span>📤 Send / Enqueue Frame</span>
        </button>
      </div>
    </section>

    <!-- Right: Live Frame Waterfall Log -->
    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">Real-Time Frame Stream &amp; Backoff Trace</div>
        <div style="display: flex; gap: 8px">
          <label
            style="
              display: flex;
              align-items: center;
              gap: 4px;
              font-size: 11px;
              color: var(--muted);
              cursor: pointer;
              text-transform: none;
            "
          >
            <input type="checkbox" id="chkHeartbeats" checked style="width: auto" /> Show Heartbeats
          </label>
          <button
            class="btn btn-secondary"
            style="padding: 4px 8px; font-size: 11px"
            id="btnClearFeed"
          >
            Clear
          </button>
        </div>
      </div>

      <div class="panel-body">
        <div class="stream-feed" id="streamFeed"></div>
      </div>
    </section>

    <script>
      let isConnected = true;
      let offlineQueue = [];
      let heartbeatTimer = null;

      const statusBadge = document.getElementById("statusBadge");
      const queueCounter = document.getElementById("queueCounter");
      const btnConnect = document.getElementById("btnConnect");
      const btnDisconnect = document.getElementById("btnDisconnect");
      const channelSelect = document.getElementById("channelSelect");
      const payloadInput = document.getElementById("payloadInput");
      const btnPublish = document.getElementById("btnPublish");
      const streamFeed = document.getElementById("streamFeed");
      const btnClearFeed = document.getElementById("btnClearFeed");
      const chkHeartbeats = document.getElementById("chkHeartbeats");

      function logFrame(direction, channel, payload, isHb = false) {
        if (isHb && !chkHeartbeats.checked) return;

        const row = document.createElement("div");
        row.className = `msg-row ${isHb ? "heartbeat" : direction === "OUT" ? "outbound" : "inbound"}`;

        const timeStr =
          new Date().toTimeString().split(" ")[0] +
          "." +
          String(Date.now() % 1000).padStart(3, "0");
        const dirClass = isHb ? "hb" : direction === "OUT" ? "out" : "in";

        row.innerHTML = `
        <span class="msg-dir ${dirClass}">[${direction}]</span>
        <span class="msg-channel">${channel}</span>
        <span class="msg-body">${typeof payload === "object" ? JSON.stringify(payload) : payload}</span>
        <span class="msg-time">${timeStr}</span>
      `;

        streamFeed.appendChild(row);
        streamFeed.scrollTop = streamFeed.scrollHeight;
      }

      function setConnection(state) {
        if (state === "CONNECTED") {
          isConnected = true;
          statusBadge.textContent = "CONNECTED";
          statusBadge.className = "badge-status status-connected";
          // Flush offline queue
          if (offlineQueue.length > 0) {
            logFrame(
              "SYS",
              "pool:reconnect",
              `Flushing ${offlineQueue.length} queued offline messages`,
            );
            while (offlineQueue.length > 0) {
              const item = offlineQueue.shift();
              logFrame("OUT", item.channel, item.payload);
            }
            queueCounter.textContent = "0";
          }
        } else if (state === "DISCONNECTED") {
          isConnected = false;
          statusBadge.textContent = "DISCONNECTED";
          statusBadge.className = "badge-status status-disconnected";
          logFrame(
            "SYS",
            "pool:status",
            "Connection dropped. Exponential backoff retry scheduled.",
          );
        }
      }

      btnConnect.addEventListener("click", () => setConnection("CONNECTED"));
      btnDisconnect.addEventListener("click", () => setConnection("DISCONNECTED"));

      btnPublish.addEventListener("click", () => {
        const channel = channelSelect.value;
        let payload;
        try {
          payload = JSON.parse(payloadInput.value);
        } catch {
          payload = payloadInput.value;
        }

        if (isConnected) {
          logFrame("OUT", channel, payload);
          // Simulate response for RPC invocations
          if (channel === "rpc:invoke") {
            setTimeout(() => {
              logFrame("IN", "rpc:response", {
                id: payload.id || "rpc-101",
                result: { status: "ok", durationMs: 42 },
              });
            }, 80);
          }
        } else {
          offlineQueue.push({ channel, payload });
          queueCounter.textContent = offlineQueue.length;
          logFrame("QUEUE", channel, `[BUFFERED OFFLINE] ${JSON.stringify(payload)}`);
        }
      });

      btnClearFeed.addEventListener("click", () => {
        streamFeed.innerHTML = "";
      });

      // Periodic heartbeat simulation
      setInterval(() => {
        if (isConnected) {
          logFrame("OUT", "__heartbeat__", { ping: Date.now() }, true);
          setTimeout(() => {
            if (isConnected) {
              logFrame("IN", "__heartbeat__", { pong: Date.now() }, true);
            }
          }, 30);
        }
      }, 4000);

      // Initial greeting
      logFrame("SYS", "pool:init", "WebSocket multiplex pool initialized and listening.");
    </script>
  </body>
</html>
